name: Copilot Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # 1️⃣ 코드 체크아웃
      - uses: actions/checkout@v3

      # 2️⃣ .NET 설치 (C#용)
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      # 3️⃣ Python 설치 (스크립트 실행용)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.5'

      # 4️⃣ Copilot CLI 설치
      - name: Install Copilot CLI
        run: |
          curl -sSL https://github.com/github/copilot-cli/releases/latest/download/copilot-linux-amd64.tar.gz | tar xz
          sudo mv copilot /usr/local/bin/

      # 5️⃣ 변경된 파일 범위 정보 설정
      - name: Set PR diff SHAs
        id: sha
        run: |
          echo "GITHUB_SHA_BEFORE=$(jq -r .before $GITHUB_EVENT_PATH)" >> $GITHUB_ENV
          echo "GITHUB_SHA=$(jq -r .after $GITHUB_EVENT_PATH)" >> $GITHUB_ENV
          echo "PR_NUMBER=$(jq -r .pull_request.number $GITHUB_EVENT_PATH)" >> $GITHUB_ENV

      # 6️⃣ Copilot 리뷰 실행
      - name: Run Copilot Review
        run: |
          python scripts/run_copilot_review.py
